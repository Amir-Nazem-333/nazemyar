<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ناظم‌یار | رضایت‌نامه آنلاین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#0E1626;
  --navy-900:#131F35;
  --navy-800:#182B4A;
  --navy-700:#22375C;
  --navy-600:#2F4876;
  --paper:#EEF1F6;
  --paper-2:#F7F8FB;
  --card:#FFFFFF;
  --line:#DCE2EC;
  --ink:#182233;
  --ink-soft:#5B6579;
  --gold:#B8863E;
  --gold-soft:#F1E4CB;
  --teal:#2C8A75;
  --teal-soft:#DEF1EB;
  --amber:#C08A3E;
  --amber-soft:#F5E8D3;
  --brick:#B23B3B;
  --brick-soft:#F6DEDE;
  --shadow-1: 0 1px 2px rgba(14,22,38,.06), 0 8px 24px -12px rgba(14,22,38,.18);
  --shadow-2: 0 2px 8px rgba(14,22,38,.10), 0 20px 48px -20px rgba(14,22,38,.28);
  --radius: 16px;
  --radius-sm: 10px;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Vazirmatn', system-ui, sans-serif;
  background:var(--paper);
  color:var(--ink);
  direction:rtl;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color: transparent;
}
::selection{background:var(--gold-soft);}
button{font-family:inherit;}
img{max-width:100%;}
.hidden{display:none !important;}

/* ---------- decorative arabesque corner ---------- */
.corner-ornament{position:absolute;width:46px;height:46px;opacity:.55;pointer-events:none;}
.corner-ornament svg{width:100%;height:100%;}
.corner-tl{top:10px;right:10px;}
.corner-br{bottom:10px;left:10px;transform:rotate(180deg);}

/* ---------- landing ---------- */
.landing{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px 18px 56px;
  background:
    radial-gradient(1100px 520px at 85% -10%, rgba(184,134,62,.14), transparent 60%),
    radial-gradient(900px 480px at 10% 110%, rgba(24,43,74,.10), transparent 60%),
    var(--paper);
}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:34px;}
.seal{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(155deg,var(--navy-800),var(--navy-950));
  display:flex;align-items:center;justify-content:center;
  box-shadow: var(--shadow-1);
  border:2px solid var(--gold);
  flex:none;
}
.seal svg{width:26px;height:26px;}
.brand-text b{display:block;font-size:19px;font-weight:800;color:var(--navy-900);}
.brand-text span{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

.hero-card{
  width:100%;max-width:900px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow-2);
  padding:44px 38px 38px;
  position:relative;
  overflow:hidden;
  animation:rise .6s cubic-bezier(.2,.8,.2,1);
}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.99);}to{opacity:1;transform:none;}}
.hero-card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:6px;
  background:linear-gradient(90deg,var(--navy-800),var(--gold) 50%,var(--navy-800));
}
.hero-title{font-size:clamp(19px,5vw,30px);font-weight:800;color:var(--navy-950);line-height:1.6;margin:0 0 10px;}
.hero-sub{color:var(--ink-soft);font-size:clamp(13px,3.6vw,15px);line-height:2;max-width:60ch;margin:0 0 26px;}
@media (max-width:560px){
  .landing{padding:22px 12px 40px;}
  .hero-card{padding:26px 18px 22px;border-radius:20px;}
  .brand-row{margin-bottom:22px;}
  .seal{width:44px;height:44px;}
  .seal svg{width:22px;height:22px;}
  .brand-text b{font-size:16.5px;}
  .foot-note{font-size:11px;padding:0 4px;}
}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:640px){.choice-grid{grid-template-columns:1fr;}}
.choice-card{
  text-align:right;border:1.5px solid var(--line);background:var(--paper-2);
  border-radius:var(--radius);padding:22px 20px;cursor:pointer;
  transition:border-color .15s, transform .15s, background .15s;
  display:flex;flex-direction:column;gap:10px;
}
.choice-card:hover{border-color:var(--gold);background:#fff;transform:translateY(-2px);}
.choice-card .ico{
  width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
}
.choice-card.parent .ico{background:var(--teal-soft);color:var(--teal);}
.choice-card.school .ico{background:var(--gold-soft);color:var(--gold);}
.choice-card h3{margin:0;font-size:16.5px;font-weight:700;color:var(--navy-950);}
.choice-card p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.9;}
.choice-card .go{font-size:12.5px;font-weight:600;color:var(--navy-800);display:flex;align-items:center;gap:6px;margin-top:4px;}
.foot-note{margin-top:22px;font-size:12px;color:#94A0B4;text-align:center;max-width:640px;}

/* ---------- shared layout ---------- */
.app-shell{min-height:100vh;display:flex;}
.sidebar{
  width:238px;max-width:82vw;flex:none;background:var(--navy-950);color:#DCE3F0;
  display:flex;flex-direction:column;padding:20px 16px;
  position:sticky;top:0;height:100vh;
}
.sidebar .brand-row{margin-bottom:26px;}
.sidebar .brand-text b{color:#fff;}
.sidebar .brand-text span{color:#8B96AC;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;
  color:#B7C0D4;font-size:13.6px;font-weight:600;cursor:pointer;margin-bottom:3px;border:1px solid transparent;
  transition:background .15s, color .15s, border-color .15s;
}
.nav-item svg{width:18px;height:18px;flex:none;}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
.nav-item.active{background:rgba(184,134,62,.16);color:#fff;border-color:rgba(184,134,62,.4);}
.nav-sep{height:1px;background:rgba(255,255,255,.08);margin:12px 0;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);}
.who-chip{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:8px;}
.who-chip .av{width:30px;height:30px;border-radius:50%;background:var(--navy-700);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex:none;}
.who-chip .nm{font-size:12.5px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.who-chip .rl{font-size:10.5px;color:#8B96AC;}
.logout-btn{width:100%;text-align:center;padding:9px;border-radius:9px;background:transparent;border:1px solid rgba(255,255,255,.15);color:#C8D0E0;font-size:12.5px;font-weight:600;cursor:pointer;}
.logout-btn:hover{border-color:var(--brick);color:#fff;}

.main{flex:1;min-width:0;}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(238,241,246,.86);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.topbar h1{font-size:17px;margin:0;font-weight:800;color:var(--navy-950);}
.topbar .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.mobile-nav-toggle{display:none;}
@media (max-width:900px){
  .sidebar{position:fixed;inset-inline-end:0;top:0;height:100vh;transform:translateX(105%);transition:transform .22s;z-index:60;box-shadow:var(--shadow-2);}
  .sidebar.open{transform:none;}
  .mobile-nav-toggle{display:flex;}
  .overlay-mask{position:fixed;inset:0;background:rgba(10,14,24,.4);z-index:55;}
}
.page{padding:22px 26px 60px;max-width:1180px;}
@media (max-width:680px){
  .page{padding:16px 14px 50px;}
  .topbar{padding:12px 14px;}
  .topbar h1{font-size:15px;}
  .topbar .sub{display:none;}
  .card-pad{padding:16px;}
  .section-title{font-size:14px;}
  .stat-grid{gap:10px;}
  .stat-card{padding:13px 14px;}
  .stat-card .val{font-size:21px;}
}
@media (max-width:420px){
  .stat-grid{grid-template-columns:1fr 1fr;gap:8px;}
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:11px;font-size:13.6px;font-weight:700;cursor:pointer;border:1.5px solid transparent;
  transition:transform .12s, box-shadow .12s, background .12s, border-color .12s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--navy-900);color:#fff;}
.btn-primary:hover{background:var(--navy-800);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{box-shadow:0 6px 18px -6px rgba(184,134,62,.6);}
.btn-outline{background:#fff;color:var(--navy-900);border-color:var(--line);}
.btn-outline:hover{border-color:var(--navy-700);}
.btn-ghost{background:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--paper);}
.btn-danger{background:#fff;color:var(--brick);border-color:var(--brick-soft);}
.btn-danger:hover{background:var(--brick-soft);}
.btn-success{background:var(--teal);color:#fff;}
.btn-success:hover{filter:brightness(1.05);}
.btn-sm{padding:7px 12px;font-size:12.3px;border-radius:9px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn svg{width:16px;height:16px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1);}
.card-pad{padding:20px 22px;}
.section-title{font-size:15px;font-weight:800;color:var(--navy-950);margin:0 0 4px;}
.section-desc{font-size:12.8px;color:var(--ink-soft);margin:0 0 16px;line-height:1.8;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
@media (max-width:800px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;}
.stat-card .lbl{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
.stat-card .val{font-size:26px;font-weight:800;color:var(--navy-950);}
.stat-card .bar{position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;}
.stat-card.pending .bar{background:var(--amber);}
.stat-card.approved .bar{background:var(--teal);}
.stat-card.rejected .bar{background:var(--brick);}
.stat-card.total .bar{background:var(--navy-800);}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12.6px;font-weight:700;color:var(--navy-900);}
.field .hint{font-size:11.4px;color:#8891A2;}
input[type=text],input[type=date],input[type=time],input[type=tel],input[type=password],input[type=number],select,textarea{
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.6px;font-family:inherit;
  background:#fff;color:var(--ink);outline:none;width:100%;
}
textarea{resize:vertical;min-height:74px;line-height:1.8;}
input:focus,select:focus,textarea:focus{border-color:var(--navy-700);box-shadow:0 0 0 3px rgba(24,43,74,.08);}
.radio-row,.check-row{display:flex;flex-wrap:wrap;gap:10px;}
.chip-option{border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);background:#fff;}
.chip-option input{display:none;}
.chip-option.checked{border-color:var(--navy-800);background:var(--navy-950);color:#fff;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.6px;font-weight:700;}
.badge.pending{background:var(--amber-soft);color:#8A5E22;}
.badge.approved{background:var(--teal-soft);color:#1D6B59;}
.badge.rejected{background:var(--brick-soft);color:#8F2F2F;}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px;}
thead th{text-align:right;font-size:11.6px;color:var(--ink-soft);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--paper-2);white-space:nowrap;}
tbody td{padding:12px 14px;border-bottom:1px solid #EEF1F6;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:#FAFBFD;}
@media (max-width:680px){
  .table-wrap{border:none;background:transparent;border-radius:0;overflow:visible;}
  table{min-width:0;}
  thead{display:none;}
  table,tbody,tr,td{display:block;width:100%;}
  tbody tr{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-1);margin-bottom:10px;padding:4px 2px;}
  tbody tr:last-child{margin-bottom:0;}
  tbody td{border-bottom:1px dashed #EEF1F6;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;font-size:12.8px;}
  tbody td:last-child{border-bottom:none;}
  tbody td:empty{display:none;}
  tbody td::before{content:attr(data-label);font-size:11px;color:var(--ink-soft);font-weight:700;flex:none;text-align:right;}
  tbody td[data-label=""]::before{display:none;}
  tbody td[data-label=""]{justify-content:center;}
  .name-strong{font-size:13.6px;}
}
.name-strong{font-weight:700;color:var(--navy-950);}
.muted{color:var(--ink-soft);}
.wizard-actions{gap:10px;}
.wizard-actions .btn{flex:1;}
@media (max-width:520px){
  .wizard-actions{flex-direction:column-reverse;}
  .wizard-actions .btn{width:100%;}
}
.filters-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center;}
.filters-row select,.filters-row input{width:auto;min-width:140px;}
@media (max-width:560px){
  .filters-row{flex-direction:column;align-items:stretch;}
  .filters-row select,.filters-row input,.search-box{width:100%;min-width:0;}
}
.search-box{position:relative;flex:1;min-width:180px;}
.search-box svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:10px;width:15px;height:15px;color:#9AA4B7;}
.search-box input{padding-inline-start:32px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state svg{width:44px;height:44px;color:#C7CEDC;margin-bottom:12px;}
.empty-state h4{margin:0 0 6px;color:var(--navy-900);font-size:14.5px;}
.empty-state p{margin:0;font-size:12.8px;}

/* consent type tiles */
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:900px){.type-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:600px){.type-grid{grid-template-columns:1fr;}}
.type-tile{border:1.5px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;background:#fff;text-align:right;transition:.15s;position:relative;}
.type-tile:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow-1);}
.type-tile .ico{width:38px;height:38px;border-radius:10px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--navy-800);margin-bottom:10px;}
.type-tile h4{margin:0 0 5px;font-size:14.5px;color:var(--navy-950);}
.type-tile p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.8;}
.type-tile .cam-flag{position:absolute;top:14px;left:14px;font-size:10px;background:var(--gold-soft);color:var(--gold);padding:3px 8px;border-radius:999px;font-weight:700;}

/* wizard */
.wizard-steps{display:flex;align-items:center;gap:0;margin-bottom:26px;}
.wz-step{display:flex;align-items:center;gap:8px;flex:1;position:relative;}
.wz-dot{width:26px;height:26px;border-radius:50%;background:#E4E9F1;color:#8891A2;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;z-index:1;}
.wz-step.done .wz-dot{background:var(--teal);color:#fff;}
.wz-step.active .wz-dot{background:var(--navy-900);color:#fff;}
.wz-label{font-size:12px;font-weight:700;color:#9AA4B7;white-space:nowrap;}
.wz-step.active .wz-label,.wz-step.done .wz-label{color:var(--navy-950);}
.wz-line{position:absolute;top:13px;right:calc(50% + 13px);left:calc(-50% + 13px);height:2px;background:#E4E9F1;z-index:0;}
.wz-step:first-child .wz-line{display:none;}
.wz-step.done .wz-line{background:var(--teal);}
@media (max-width:700px){.wz-label{display:none;}}

.legal-box{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-height:230px;overflow-y:auto;font-size:13px;line-height:2.1;color:var(--ink);}
.legal-box h5{margin:0 0 8px;color:var(--navy-950);}
.agree-row{display:flex;align-items:flex-start;gap:10px;margin-top:14px;background:var(--gold-soft);border:1px solid #E6D3AC;border-radius:12px;padding:12px 14px;}
.agree-row input{width:auto;margin-top:3px;}
.agree-row label{font-size:12.8px;line-height:1.9;color:#6E5121;}

/* camera / KYC */
.kyc-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;}
.kyc-frame{
  width:100%;max-width:420px;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:var(--navy-950);
  position:relative;border:3px solid var(--navy-900);
}
.kyc-frame video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
.kyc-frame .oval-guide{position:absolute;inset:8% 22%;border:2.5px dashed rgba(255,255,255,.55);border-radius:50%;pointer-events:none;}
.kyc-frame .ring-wrap{position:absolute;top:10px;left:10px;width:52px;height:52px;}
.kyc-frame .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.kyc-frame .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;}
.kyc-frame .cam-status{position:absolute;bottom:10px;right:10px;left:10px;background:rgba(14,22,38,.55);color:#fff;font-size:11.5px;padding:6px 10px;border-radius:8px;text-align:center;}
.phrase-card{width:100%;max-width:420px;background:var(--navy-950);color:#fff;border-radius:14px;padding:16px 18px;text-align:center;}
.phrase-card .lbl{font-size:11px;color:#93A0BE;margin-bottom:8px;}
.phrase-card .txt{font-size:clamp(13px,3.8vw,15px);line-height:1.95;font-weight:600;}
.phrase-card .code{margin-top:10px;font-size:22px;font-weight:800;letter-spacing:2px;color:var(--gold);}
@media (max-width:420px){
  .kyc-frame{max-width:100%;}
  .phrase-card{padding:13px 14px;}
}
.shots-row{display:flex;gap:8px;}
.shot-thumb{width:64px;height:48px;border-radius:8px;overflow:hidden;border:2px solid var(--line);}
.shot-thumb img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
.cam-error{background:var(--brick-soft);color:#8F2F2F;border-radius:12px;padding:16px;font-size:13px;text-align:center;line-height:1.9;max-width:420px;}

/* signature */
.sig-wrap{border:1.5px dashed var(--line);border-radius:14px;background:#fff;position:relative;}
.sig-wrap canvas{width:100%;height:180px;display:block;touch-action:none;border-radius:14px;}
.sig-baseline{position:absolute;bottom:36px;left:20px;right:20px;height:1px;background:#E4E9F1;}
.sig-hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#B7BFCF;font-size:12px;pointer-events:none;}

/* modal / drawer */
.modal-mask{position:fixed;inset:0;background:rgba(10,14,24,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-2);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;}
.modal-head h3{margin:0;font-size:15.5px;font-weight:800;color:var(--navy-950);}
.modal-close{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex:none;}
.modal-body{padding:20px;}

const FA_DIGITS=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function faNum(n){return String(n).replace(/[0-9]/g,d=>FA_DIGITS[d]);}
function uid(p){return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad2(n){return n<10?'0'+n:''+n;}

function gToJalali(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  const gy2=(gm>2)?(gy+1):gy;
  let days=355666+(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+g_d_m[gm-1];
  let jy=-1595+(33*Math.floor(days/12053));
  days%=12053;
  jy+=4*Math.floor(days/1461);
  days%=1461;
  if(days>365){ jy+=Math.floor((days-1)/365); days=(days-1)%365; }
  let jm,jd;
  if(days<186){ jm=1+Math.floor(days/31); jd=1+(days%31); }
  else{ jm=7+Math.floor((days-186)/30); jd=1+((days-186)%30); }
  return [jy,jm,jd];
}
const JMONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function jalaliStr(dateObj,withTime){
  const d=dateObj||new Date();
  const [jy,jm,jd]=gToJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
  let s=faNum(jd)+' '+JMONTHS[jm-1]+' '+faNum(jy);
  if(withTime) s+= '  ساعت '+faNum(pad2(d.getHours()))+':'+faNum(pad2(d.getMinutes()));
  return s;
}
function isoDateToJalali(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); const [jy,jm,jd]=gToJalali(d.getFullYear(),d.getMonth()+1,d.getDate()); return faNum(jd)+' '+JMONTHS[jm-1]+' '+faNum(jy); }

function validateNationalCode(code){
  if(!/^\d{10}$/.test(code||'')) return false;
  if(/^(\d)\1{9}$/.test(code)) return false;
  const check=parseInt(code[9],10);
  let sum=0;
  for(let i=0;i<9;i++) sum+=parseInt(code[i],10)*(10-i);
  const r=sum%11;
  return (r<2 && check===r)||(r>=2 && check===11-r);
}
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,type){
  const host=document.getElementById('toastHost');

  el.textContent=msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260); },2600);
}

/* ============================= RENDER ROOT ============================= */
function render(){
  const app=document.getElementById('app');
  if(state.route==='landing'){ app.innerHTML=viewLanding(); bindLanding(); return; }
  if(state.route==='parentLogin'){ app.innerHTML=viewParentLogin(); bindParentLogin(); return; }
  if(state.route==='schoolLogin'){ app.innerHTML=viewSchoolLogin(); bindSchoolLogin(); return; }
  app.innerHTML = shell();
  bindShell();
  const target=document.getElementById('pageTarget');
  if(state.route.startsWith('parent.')) renderParentPage(target);
  else if(state.route.startsWith('school.')) renderSchoolPage(target);
}

        </div>
        <p class="small-note" style="margin-top:10px">راهنما (فقط نسخهٔ نمایشی): <span id="pinHint" style="font-weight:800;color:var(--navy-900)"></span></p>
        <button class="btn btn-primary btn-block" id="pinSubmit" style="margin-top:6px">ورود</button>
      </div>

function bindParentLogin(){
  document.getElementById('backLanding').onclick=()=>setRoute('landing');
  let selected=null;
  document.querySelectorAll('.parent-pick').forEach(el=>{
    el.onclick=()=>{
      document.querySelectorAll('.parent-pick').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      selected=DB.parents.find(p=>p.id===el.dataset.id);
      document.getElementById('pinArea').classList.remove('hidden');
      document.getElementById('pinParentName').textContent=selected.fullName;
      document.getElementById('pinHint').textContent=selected.pin;
      const boxes=document.querySelectorAll('.pinbox');
      boxes.forEach(b=>b.value='');
      boxes[0].focus();
    };
  });
  document.querySelectorAll('.pinbox').forEach((b,i,arr)=>{
    b.addEventListener('input',()=>{ b.value=b.value.replace(/\D/g,'').slice(0,1); if(b.value && arr[i+1]) arr[i+1].focus(); });
    b.addEventListener('keydown',e=>{ if(e.key==='Backspace' && !b.value && arr[i-1]) arr[i-1].focus(); });
  });
  document.getElementById('pinSubmit').onclick=()=>{
    if(!selected){ toast('ابتدا نام خود را انتخاب کنید','error'); return; }
    const entered=[...document.querySelectorAll('.pinbox')].map(b=>b.value).join('');
    if(entered.length<4){ toast('کد ۴ رقمی را کامل وارد کنید','error'); return; }
    if(entered!==selected.pin){ toast('کد وارد شده صحیح نیست','error'); return; }
    DB.session={role:'parent',parentId:selected.id};
    persist();
    toast('خوش آمدید '+selected.fullName,'success');
    setRoute('parent.dashboard');
  };
}

function bindShell(){
  document.querySelectorAll('.nav-item').forEach(el=>{

/* ============================= PARENT PAGES ============================= */
function currentParent(){ return DB.parents.find(p=>p.id===DB.session.parentId); }
function studentsOf(parent){ return DB.students.filter(s=>parent.studentIds.includes(s.id)); }
function typeById(id){ return DB.consentTypes.find(t=>t.id===id); }
function statusBadge(st){
  const map={pending:['در انتظار بررسی','pending'],approved:['تایید شده','approved'],rejected:['رد شده','rejected']};
  const [l,c]=map[st]||['نامشخص','pending'];
  return `<span class="badge dot ${c}">${l}</span>`;
}
const TYPE_ICON={exit:ICO.hand,thirdparty:ICO.users,trip:ICO.trip,medical:ICO.medical,general:ICO.doc};

function renderParentPage(target){
  const parent=currentParent();
  if(!parent){ setRoute('landing'); return; }
  if(state.route==='parent.dashboard') return renderParentDashboard(target,parent);
  if(state.route==='parent.new') return renderParentNew(target,parent);
  if(state.route==='parent.history') return renderParentHistory(target,parent);
}

function renderParentDashboard(target,parent){
  const kids=studentsOf(parent);
  const myReqs=DB.consentRequests.filter(r=>r.parentId===parent.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const pending=myReqs.filter(r=>r.status==='pending').length;
  target.innerHTML=`
  <div class="stat-grid">
    <div class="stat-card total"><span class="bar"></span><div class="lbl">فرزندان ثبت‌شده</div><div class="val">${faNum(kids.length)}</div></div>
    <div class="stat-card pending"><span class="bar"></span><div class="lbl">در انتظار بررسی</div><div class="val">${faNum(pending)}</div></div>
    <div class="stat-card approved"><span class="bar"></span><div class="lbl">تایید شده</div><div class="val">${faNum(myReqs.filter(r=>r.status==='approved').length)}</div></div>
    <div class="stat-card total"><span class="bar"></span><div class="lbl">کل درخواست‌ها</div><div class="val">${faNum(myReqs.length)}</div></div>
  </div>
  <div class="card card-pad" style="margin-bottom:18px">
    <h3 class="section-title">فرزندان شما</h3>
    <p class="section-desc">درخواست جدید را برای هرکدام از این دانش‌آموزان می‌توانید ثبت کنید.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      ${kids.map(k=>`<div style="border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px">
        <div class="av" style="width:36px;height:36px;border-radius:50%;background:var(--navy-900);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">${k.fullName[0]}</div>
        <div><div style="font-weight:700;font-size:13.4px">${escapeHtml(k.fullName)}</div><div class="muted" style="font-size:11.8px">پایه ${escapeHtml(k.grade)} - کلاس ${escapeHtml(k.className)}</div></div>
      </div>`).join('')}
    </div>
    <button class="btn btn-gold" style="margin-top:16px" id="quickNew">${ICO.plus} ثبت درخواست جدید</button>
  </div>
  <div class="card card-pad">
    <h3 class="section-title">آخرین درخواست‌ها</h3>
    ${myReqs.length===0?emptyState('هنوز درخواستی ثبت نشده','برای ثبت اولین رضایت‌نامه روی دکمه «ثبت رضایت جدید» بزنید.'):`
    <div class="table-wrap"><table><thead><tr><th>نوع درخواست</th><th>دانش‌آموز</th><th>تاریخ</th><th>وضعیت</th></tr></thead><tbody>
    ${myReqs.slice(0,5).map(r=>{
      const st=DB.students.find(s=>s.id===r.studentId);
      return `<tr data-id="${r.id}"><td data-label="نوع درخواست">${escapeHtml(typeById(r.typeId).title)}</td><td data-label="دانش‌آموز">${escapeHtml(st?st.fullName:'-')}</td><td class="muted" data-label="تاریخ">${jalaliStr(new Date(r.createdAt))}</td><td data-label="وضعیت">${statusBadge(r.status)}</td></tr>`;
    }).join('')}
    </tbody></table></div>`}
  </div>`;
  const q=document.getElementById('quickNew'); if(q) q.onclick=()=>setRoute('parent.new');
  target.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>openRequestDetail(tr.dataset.id,'parent'));
}
function emptyState(title,desc){
  return `<div class="empty-state">${ICO.empty}<h4>${title}</h4><p>${desc}</p></div>`;
}

/* ---- Parent: New consent wizard ---- */
function newWizardState(parent){
  return {
    step:1, parentId:parent.id, kids:studentsOf(parent),
    typeId:null, studentId: studentsOf(parent)[0] ? studentsOf(parent)[0].id : null,
    details:{}, agree:false,
    verification:{phrase:'',code:'',photos:[],stream:null,capturing:false,geolocation:null},
    signatureData:null
  };
}
function renderParentNew(target,parent){
  if(!state.wizard || state.wizard.parentId!==parent.id) state.wizard=newWizardState(parent);
  const w=state.wizard;
  if(studentsOf(parent).length===0){
    target.innerHTML=emptyState('دانش‌آموزی برای شما ثبت نشده','برای ثبت درخواست، ابتدا باید مدرسه فرزند شما را در سامانه ثبت کند.');
    return;
  }
  target.innerHTML=`
    ${wizardSteps(w.step)}
    <div class="card card-pad" id="wizBody"></div>
  `;
  renderWizardStep();
}
function wizardSteps(step){
  const labels=['نوع درخواست','جزئیات','متن رضایت','احراز هویت','امضا','ثبت نهایی'];
  return `<div class="wizard-steps">${labels.map((l,i)=>{
    const n=i+1; const cls= n<step?'done':(n===step?'active':'');
    return `<div class="wz-step ${cls}"><div class="wz-line"></div><div class="wz-dot">${n<step?'':faNum(n)}</div><div class="wz-label">${l}</div></div>`;
  }).join('')}</div>`;
}
function renderWizardStep(){
  const w=state.wizard;
  const body=document.getElementById('wizBody');
  if(w.step===1) return stepChooseType(body,w);
  if(w.step===2) return stepDetails(body,w);
  if(w.step===3) return stepLegal(body,w);
  if(w.step===4) return stepCamera(body,w);
  if(w.step===5) return stepSignature(body,w);
  if(w.step===6) return stepReview(body,w);
}
function goStep(n){ state.wizard.step=n; document.getElementById('pageTarget').querySelector('.wizard-steps').outerHTML=wizardSteps(n); renderWizardStep(); window.scrollTo({top:0,behavior:'smooth'}); }

function stepChooseType(body,w){
  body.innerHTML=`
    <h3 class="section-title">دانش‌آموز و نوع درخواست را انتخاب کنید</h3>
    <div class="field" style="max-width:320px;margin-bottom:18px">
      <label>دانش‌آموز</label>
      <select id="selStudent">${w.kids.map(k=>`<option value="${k.id}" ${k.id===w.studentId?'selected':''}>${escapeHtml(k.fullName)} — پایه ${escapeHtml(k.grade)}</option>`).join('')}</select>
    </div>
    <div class="type-grid">
      ${DB.consentTypes.map(t=>`
        <div class="type-tile" data-id="${t.id}">
          ${t.requiresCamera?`<span class="cam-flag">نیاز به دوربین</span>`:''}
          <div class="ico">${TYPE_ICON[t.id]||ICO.doc}</div>
          <h4>${escapeHtml(t.title)}</h4>
          <p>${escapeHtml(t.description)}</p>
        </div>`).join('')}
    </div>
  `;
  document.getElementById('selStudent').onchange=e=>{ w.studentId=e.target.value; };
  body.querySelectorAll('.type-tile').forEach(el=>{
    el.onclick=()=>{
      w.typeId=el.dataset.id;
      w.details={};
      goStep(2);
    };
  });
}
function fieldsForType(typeId){
  if(typeId==='exit') return ['exit'];
  if(typeId==='thirdparty') return ['thirdparty'];
  if(typeId==='trip') return ['trip'];
  if(typeId==='medical') return ['medical'];
  return ['general'];
}

  if(w.typeId==='exit'){
    formHtml=`

    formHtml=`

      <div class="field"><label>معتبر تا تاریخ</label><input type="date" id="f_to" value="${d.to||todayISO()}"></div>
    </div>
    <div class="field"><label>توضیحات تکمیلی</label><textarea id="f_note">${d.note||''}</textarea></div>`;
  } else if(w.typeId==='trip'){
    formHtml=`

function collectDetails(w){

    if(d.reason) rows.push(['دلیل',d.reason]);

    rows.push(['نام شخص ثالث',d.tpName],['کد ملی',faNum(d.tpNid||'')],['نسبت',d.tpRel],['تلفن',faNum(d.tpPhone||'')],['بازه اعتبار',isoDateToJalali(d.from)+' تا '+isoDateToJalali(d.to)]);

function stepCamera(body,w){

    </div>`;

  const nextBtn=document.getElementById('wNext');
  nextBtn.onclick=()=>{ stopCamStream(w); goStep(5); };
  startCamStep(w,nextBtn);
}
function stopCamStream(w){
  if(w.verification.stream){ w.verification.stream.getTracks().forEach(t=>t.stop()); w.verification.stream=null; }
}
function startCamStep(w,nextBtn){
  const v=w.verification;
  const camArea=document.getElementById('camArea');
  const shotsArea=document.getElementById('shotsArea');
  function renderShots(){
    shotsArea.innerHTML=v.photos.map(p=>`<div class="shot-thumb"><img src="${p}"></div>`).join('');
  }
  function renderRetake(){
    document.getElementById('camActions').innerHTML=`<button class="btn btn-outline btn-sm" id="retakeBtn">${ICO.camera} ضبط مجدد</button><span class="badge dot approved">هویت ثبت شد</span>`;
    document.getElementById('retakeBtn').onclick=()=>{ v.photos=[]; v.code=randCode(); v.phrase=AFFIRM_PHRASES[Math.floor(Math.random()*AFFIRM_PHRASES.length)]; renderParentNew(document.getElementById('pageTarget'), currentParent()); };
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    camArea.innerHTML=`<div class="cam-error">مرورگر شما از دسترسی به دوربین پشتیبانی نمی‌کند. لطفاً از مرورگر دیگری یا یک گوشی هوشمند استفاده کنید.</div>`;
    return;
  }
  camArea.innerHTML=`<div class="kyc-frame"><video id="kycVideo" autoplay playsinline muted></video><div class="oval-guide"></div>
    <div class="ring-wrap"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" stroke="rgba(255,255,255,.25)" stroke-width="4" fill="none"/><circle id="ringProgress" cx="26" cy="26" r="22" stroke="#B8863E" stroke-width="4" fill="none" stroke-dasharray="138" stroke-dashoffset="138"/></svg><div class="ring-num" id="ringNum"></div></div>
    <div class="cam-status" id="camStatus">در حال اتصال به دوربین...</div></div>`;
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(stream=>{
    v.stream=stream;
    const video=document.getElementById('kycVideo');
    video.srcObject=stream;
    document.getElementById('camStatus').textContent='چهره خود را داخل قاب بیضی قرار دهید و عبارت بالا را بخوانید';
    let count=6;
    const ringNum=document.getElementById('ringNum');
    const ring=document.getElementById('ringProgress');
    ringNum.textContent=faNum(count);
    const timer=setInterval(()=>{
      count--;
      if(count<=0){ clearInterval(timer); ringNum.textContent=''; document.getElementById('camStatus').textContent='در حال پردازش...'; return; }
      ringNum.textContent=faNum(count);
      const pct=(6-count)/6;
      ring.setAttribute('stroke-dashoffset', String(138-138*pct));
    },1000);
    [1800,3400,5000].forEach((t,i)=>{
      setTimeout(()=>{
        if(!v.stream) return;
        const canvas=document.createElement('canvas'); canvas.width=280; canvas.height=210;
        const ctx=canvas.getContext('2d');
        ctx.translate(280,0); ctx.scale(-1,1);
        ctx.drawImage(video,0,0,280,210);
        v.photos.push(canvas.toDataURL('image/jpeg',0.62));
        renderShots();
        if(i===2){
          setTimeout(()=>{
            stopCamStream(w);
            camArea.innerHTML=`<div class="kyc-frame" style="display:flex;align-items:center;justify-content:center"><div style="color:#fff;text-align:center;padding:20px">${ICO.check.replace('currentColor','#2C8A75')}<div style="margin-top:8px;font-size:13px">تصاویر با موفقیت ثبت شد</div></div></div>`;
            renderRetake();
            nextBtn.removeAttribute('disabled');
            if(navigator.geolocation){
              navigator.geolocation.getCurrentPosition(pos=>{ v.geolocation={lat:pos.coords.latitude,lng:pos.coords.longitude}; },()=>{},{timeout:2500});
            }
          },500);
        }
      }, t);
    });
  }).catch(err=>{
    camArea.innerHTML=`<div class="cam-error">امکان دسترسی به دوربین وجود ندارد.<br>لطفاً از تنظیمات مرورگر، دسترسی دوربین را برای این صفحه فعال کنید و دوباره تلاش کنید.<br><button class="btn btn-outline btn-sm" id="retryCam" style="margin-top:10px">تلاش مجدد</button></div>`;
    const rb=document.getElementById('retryCam'); if(rb) rb.onclick=()=>startCamStep(w,nextBtn);
  });
}

function stepSignature(body,w){
  body.innerHTML=`
    <h3 class="section-title">امضای دیجیتال</h3>
    <p class="section-desc">لطفاً با انگشت یا ماوس، امضای خود را در کادر زیر ثبت کنید.</p>
    <div class="sig-wrap"><canvas id="sigCanvas"></canvas><div class="sig-baseline"></div><div class="sig-hint" id="sigHint">امضا کنید</div></div>
    <div style="display:flex;gap:10px;margin-top:10px"><button class="btn btn-outline btn-sm" id="sigClear">پاک کردن</button></div>
    <div class="wizard-actions" style="display:flex;justify-content:space-between;margin-top:18px">
      <button class="btn btn-outline" id="wBack">بازگشت</button>
      <button class="btn btn-primary" id="wNext">مرور و ثبت نهایی</button>
    </div>`;
  document.getElementById('wBack').onclick=()=>goStep(typeById(w.typeId).requiresCamera?4:3);
  const canvas=document.getElementById('sigCanvas');
  const dpr=window.devicePixelRatio||1;
  function fit(){ const rect=canvas.getBoundingClientRect(); canvas.width=rect.width*dpr; canvas.height=180*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.strokeStyle='#182233'; }
  fit();
  let drawing=false, hasDrawn=false, last=null;
  function pos(e){ const r=canvas.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return {x:cx,y:cy}; }
  function start(e){ drawing=true; hasDrawn=true; last=pos(e); document.getElementById('sigHint').style.display='none'; e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); const ctx=canvas.getContext('2d'); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
  document.getElementById('sigClear').onclick=()=>{ const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn=false; document.getElementById('sigHint').style.display=''; };
  document.getElementById('wNext').onclick=()=>{
    if(!hasDrawn){ toast('لطفاً ابتدا امضا کنید','error'); return; }
    w.signatureData=canvas.toDataURL('image/png');
    goStep(6);
  };
}

function renderSchoolDashboard(target){
  const reqs=DB.consentRequests;
  const today=todayISO();

  const pending=reqs.filter(r=>r.status==='pending').length;
  const approved=reqs.filter(r=>r.status==='approved').length;
  const rejected=reqs.filter(r=>r.status==='rejected').length;
  const last7=[...Array(7)].map((_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(6-i));
    const iso=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    const count=reqs.filter(r=>r.createdAt.slice(0,10)===iso).length;

  });
  const max=Math.max(1,...last7.map(x=>x.count));
  target.innerHTML=`
  <div class="stat-grid">
    <div class="stat-card total"><span class="bar"></span><div class="lbl">درخواست امروز</div><div class="val">${faNum(todays.length)}</div></div>
    <div class="stat-card pending"><span class="bar"></span><div class="lbl">در انتظار بررسی</div><div class="val">${faNum(pending)}</div></div>
    <div class="stat-card approved"><span class="bar"></span><div class="lbl">تایید شده</div><div class="val">${faNum(approved)}</div></div>
    <div class="stat-card rejected"><span class="bar"></span><div class="lbl">رد شده</div><div class="val">${faNum(rejected)}</div></div>

function renderSchoolRequests(target){
  state.reqFilter = state.reqFilter || {status:'all',type:'all',q:''};
  const f=state.reqFilter;
  let list=DB.consentRequests.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(f.status!=='all') list=list.filter(r=>r.status===f.status);
  if(f.type!=='all') list=list.filter(r=>r.typeId===f.type);
  if(f.q){
    const q=f.q.trim();
    list=list.filter(r=>{
      const st=DB.students.find(s=>s.id===r.studentId); const pr=DB.parents.find(p=>p.id===r.parentId);
      return (st&&st.fullName.includes(q)) || (pr&&pr.fullName.includes(q)) || r.trackingCode.includes(q);
    });
  }
  target.innerHTML=`
  <div class="card card-pad">
    <div class="filters-row">
      <div class="search-box">${ICO.search}<input type="text" id="fq" placeholder="جستجوی نام دانش‌آموز، والد یا کد رهگیری" value="${escapeHtml(f.q)}"></div>
      <select id="fstatus">
        <option value="all" ${f.status==='all'?'selected':''}>همه وضعیت‌ها</option>
        <option value="pending" ${f.status==='pending'?'selected':''}>در انتظار</option>
        <option value="approved" ${f.status==='approved'?'selected':''}>تایید شده</option>
        <option value="rejected" ${f.status==='rejected'?'selected':''}>رد شده</option>
      </select>
      <select id="ftype">
        <option value="all" ${f.type==='all'?'selected':''}>همه انواع</option>
        ${DB.consentTypes.map(t=>`<option value="${t.id}" ${f.type===t.id?'selected':''}>${escapeHtml(t.title)}</option>`).join('')}
      </select>
    </div>
    ${list.length===0?emptyState('درخواستی یافت نشد','فیلترها را تغییر دهید یا منتظر درخواست جدید بمانید.'):
    `<div class="table-wrap"><table><thead><tr><th>کد رهگیری</th><th>نوع</th><th>دانش‌آموز</th><th>والد</th><th>تاریخ</th><th>وضعیت</th></tr></thead><tbody>
    ${list.map(r=>{
      const st=DB.students.find(s=>s.id===r.studentId); const pr=DB.parents.find(p=>p.id===r.parentId);
      return `<tr data-id="${r.id}"><td class="name-strong" data-label="کد رهگیری">${faNum(r.trackingCode)}</td><td data-label="نوع">${escapeHtml(typeById(r.typeId).title)}</td><td data-label="دانش‌آموز">${escapeHtml(st?st.fullName:'-')}</td><td data-label="والد">${escapeHtml(pr?pr.fullName:'-')}</td><td class="muted" data-label="تاریخ">${jalaliStr(new Date(r.createdAt))}</td><td data-label="وضعیت">${statusBadge(r.status)}</td></tr>`;
    }).join('')}</tbody></table></div>`}
  </div>`;
  document.getElementById('fq').oninput=e=>{ f.q=e.target.value; renderSchoolRequests(target); };
  document.getElementById('fstatus').onchange=e=>{ f.status=e.target.value; renderSchoolRequests(target); };
  document.getElementById('ftype').onchange=e=>{ f.type=e.target.value; renderSchoolRequests(target); };
  target.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>openRequestDetail(tr.dataset.id,'school'));
}

/* ---- Request detail drawer ---- */
function openRequestDetail(id, viewer){
  const req=DB.consentRequests.find(r=>r.id===id);
  if(!req) return;
  const st=DB.students.find(s=>s.id===req.studentId);
  const pr=DB.parents.find(p=>p.id===req.parentId);
  const type=typeById(req.typeId);
  const mask=document.createElement('div'); mask.className='drawer-mask';
  const drawer=document.createElement('div'); drawer.className='drawer';
  drawer.innerHTML=`
    <div class="modal-head"><h3>${escapeHtml(type.title)}</h3><button class="modal-close" id="closeDrawer">${ICO.x}</button></div>
    <div class="modal-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="badge dot ${req.status}">${req.status==='pending'?'در انتظار بررسی':req.status==='approved'?'تایید شده':'رد شده'}</div>
        <div class="muted" style="font-size:12px">کد رهگیری: <b style="color:var(--navy-950)">${faNum(req.trackingCode)}</b></div>
      </div>
      <div class="detail-row"><span class="k">دانش‌آموز</span><span class="v">${escapeHtml(st?st.fullName:'-')} ${st?('— پایه '+escapeHtml(st.grade)):''}</span></div>
      <div class="detail-row"><span class="k">والد ثبت‌کننده</span><span class="v">${escapeHtml(pr?pr.fullName:'-')} (${escapeHtml(pr?pr.relation:'')})</span></div>
      <div class="detail-row"><span class="k">تاریخ ثبت</span><span class="v">${jalaliStr(new Date(req.createdAt),true)}</span></div>
      ${detailsSummaryHtml({typeId:req.typeId, details:req.details, studentId:req.studentId})}
      ${req.verification && req.verification.photos && req.verification.photos.length? `
      <h4 style="margin:16px 0 6px;font-size:13.5px;color:var(--navy-950)">تصاویر احراز هویت</h4>
      <p class="small-note">عبارت نمایش داده‌شده: «${escapeHtml(req.verification.phrase)}» — کد: ${faNum(req.verification.code)}</p>
      <div class="photo-strip">${req.verification.photos.map(p=>`<img src="${p}">`).join('')}</div>` : ''}
      ${req.verification && req.verification.geolocation ? `<div class="detail-row"><span class="k">موقعیت مکانی (تقریبی)</span><span class="v">${req.verification.geolocation.lat.toFixed(3)}, ${req.verification.geolocation.lng.toFixed(3)}</span></div>` : ''}
      <h4 style="margin:16px 0 6px;font-size:13.5px;color:var(--navy-950)">امضای دیجیتال والد</h4>
      <img src="${req.signature}" style="border:1px solid var(--line);border-radius:10px;max-width:220px;background:#fff">
      ${viewer==='school'?`
      <div class="field" style="margin-top:16px"><label>یادداشت بررسی (اختیاری)</label><textarea id="reviewNote" placeholder="یادداشتی برای این تصمیم بنویسید...">${escapeHtml(req.reviewNote||'')}</textarea></div>
      <div style="display:flex;gap:10px;margin-top:6px">
        <button class="btn btn-success btn-block" id="approveBtn" ${req.status==='approved'?'disabled':''}>${ICO.check} تایید درخواست</button>
        <button class="btn btn-danger btn-block" id="rejectBtn" ${req.status==='rejected'?'disabled':''}>${ICO.x} رد درخواست</button>
      </div>`:''}
      <button class="btn btn-outline btn-block" style="margin-top:12px" id="printReqBtn">${ICO.print} چاپ رسید</button>
    </div>`;
  document.body.appendChild(mask); document.body.appendChild(drawer);
  const close=()=>{ mask.remove(); drawer.remove(); };
  mask.onclick=close;
  drawer.querySelector('#closeDrawer').onclick=close;
  const approveBtn=drawer.querySelector('#approveBtn');
  const rejectBtn=drawer.querySelector('#rejectBtn');
  if(approveBtn) approveBtn.onclick=()=>{ updateReqStatus(req,'approved',drawer.querySelector('#reviewNote').value); close(); toast('درخواست تایید شد','success'); render(); };
  if(rejectBtn) rejectBtn.onclick=()=>{ updateReqStatus(req,'rejected',drawer.querySelector('#reviewNote').value); close(); toast('درخواست رد شد'); render(); };
  drawer.querySelector('#printReqBtn').onclick=()=>{
    const w=document.createElement('div'); w.id='printArea'; w.style.position='fixed'; w.style.left='-9999px';
    w.innerHTML=`<div class="receipt"><div class="rtitle">${escapeHtml(DB.school.name)}</div><div class="rsub">رسید رضایت‌نامه — ${escapeHtml(type.title)}</div><div class="rcode">${faNum(req.trackingCode)}</div>
      <div class="detail-row"><span class="k">دانش‌آموز</span><span class="v">${escapeHtml(st?st.fullName:'-')}</span></div>
      <div class="detail-row"><span class="k">تاریخ ثبت</span><span class="v">${jalaliStr(new Date(req.createdAt),true)}</span></div>
      <div class="detail-row"><span class="k">وضعیت</span><span class="v">${req.status==='pending'?'در انتظار بررسی':req.status==='approved'?'تایید شده':'رد شده'}</span></div></div>`;
    document.body.appendChild(w); window.print(); setTimeout(()=>w.remove(),500);
  };
}
function updateReqStatus(req,status,note){
  req.status=status; req.reviewNote=note||''; req.statusLog.push({status,at:new Date().toISOString(),note:note||''});
  persist();
}

  <div class="card card-pad" style="margin-bottom:18px">
    <h3 class="section-title">فضای ذخیره‌سازی محلی</h3>
    <p class="section-desc">تمام داده‌ها (شامل تصاویر احراز هویت) در حافظه همین مرورگر ذخیره می‌شود.</p>
    <div class="storage-meter"><i style="width:${pct}%"></i></div>
    <p class="small-note">${faNum(usedKB)} کیلوبایت استفاده شده (تقریباً از ۵ مگابایت مرورگر)</p>
  </div>
  <div class="card card-pad">
    <h3 class="section-title">پشتیبان‌گیری و انتقال داده</h3>
    <p class="section-desc">برای انتقال اطلاعات بین دستگاه‌ها یا حفظ نسخه پشتیبان، فایل JSON را دانلود و در دستگاه دیگر بارگذاری کنید.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-outline" id="exportBtn">${ICO.doc} دریافت فایل پشتیبان</button>
      <label class="btn btn-outline" style="cursor:pointer">${ICO.doc} بارگذاری فایل پشتیبان<input type="file" id="importFile" accept="application/json" style="display:none"></label>
      <button class="btn btn-danger" id="resetBtn">پاک‌سازی کامل داده‌ها</button>
    </div>
  </div>`;
  document.getElementById('saveSchool').onclick=()=>{
    DB.school.name=document.getElementById('sName').value.trim()||DB.school.name;
    DB.school.adminPassword=document.getElementById('sPass').value.trim()||DB.school.adminPassword;
    persist(); toast('ذخیره شد','success'); render();
  };
  document.getElementById('exportBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nazemyar-consent-backup.json'; a.click();
  };
  document.getElementById('importFile').onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{ const data=JSON.parse(reader.result); DB=data; persist(); toast('اطلاعات با موفقیت بارگذاری شد','success'); render(); }
      catch(err){ toast('فایل معتبر نیست','error'); }
    };
    reader.readAsText(file);
  };
  document.getElementById('resetBtn').onclick=()=>{
    if(confirm('همه اطلاعات (دانش‌آموزان، والدین و درخواست‌ها) برای همیشه پاک شود؟')){
      localStorage.removeItem(DB_KEY); DB=seedDB(); toast('داده‌ها بازنشانی شد'); setRoute('landing');
    }
  };
}

/* ============================= INIT ============================= */
if(DB.session && DB.session.role==='parent') setRoute('parent.dashboard');
else if(DB.session && DB.session.role==='school') setRoute('school.dashboard');
else render();
</script>
</body>
</html>
